<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calendario Esami PLUS</title>
    <link rel="stylesheet" href="style.css?v=5">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#cc1c12">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container header-content">
            <div class="logo-title">
                <img src="logo.png" alt="Logo" class="app-logo">
                <div>
                    <h1>Calendario Esami PLUS</h1>
                    <p>Organizza, cerca e salva i tuoi appelli</p>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Loading Section -->
        <section id="upload-section" class="card" style="text-align: center;">
            <div class="upload-area" style="border: none; background: transparent;">
                <div class="upload-label">
                    <span class="icon">🔄</span>
                    <span style="font-size: 1.3rem;">Inizializzazione database...</span>
                </div>
                <p id="upload-status" style="margin-top: 15px; color: var(--inner-red); font-weight: 800; font-size: 1.1rem;">Caricamento appelli in corso...</p>
            </div>
        </section>

        <div class="dashboard">
            <!-- Search Section -->
            <section id="search-section" class="card hidden">
                <div style="display: flex; justify-content: center; align-items: center; margin-bottom: 20px;">
                    <h2 style="margin: 0;">Cerca e Seleziona</h2>
                </div>

                <div class="form-group">
                    <label>1. Cerca la materia</label>
                    <div class="autocomplete">
                        <input type="text" id="subject-input" placeholder="Es. Algoritmi Avanzati..." autocomplete="off">
                        <div id="autocomplete-list" class="autocomplete-items"></div>
                    </div>
                </div>

                <div id="professors-container" class="form-group hidden" style="margin-top: 20px;">
                    <label>2. Seleziona il professore</label>
                    <div id="professors-list" class="chips-container"></div>
                </div>

                <div id="appelli-container" class="form-group hidden" style="margin-top: 20px;">
                    <label>3. Scegli l'appello</label>
                    <div id="appelli-list" class="results-container" style="margin-top: 10px;"></div>
                </div>
            </section>

            <!-- Saved Exams Section -->
            <section id="saved-exams-section" class="card">
                <div class="saved-header">
                    <h2 style="margin: 0;">I Tuoi Esami</h2>
                    <div class="saved-actions">
                        <button id="share-exams-btn" class="btn btn-action" title="Condividi i tuoi esami">📤 Condividi</button>
                        <button id="show-manual-form-btn" class="btn btn-action">+ Intercorso</button>
                        <button id="clear-all-exams-btn" class="btn btn-action btn-clear" title="Svuota tutti gli esami">🗑️</button>
                    </div>
                </div>

                <!-- Manual Form -->
                <div id="manual-exam-form" class="hidden" style="background: var(--white); padding: 20px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
                    <h3 style="margin-bottom: 15px; color: var(--text-dark-red); font-family: 'Fredoka', sans-serif; font-size: 1.2rem;">Aggiungi Prova Intercorso</h3>
                    <input type="text" id="manual-exam-name" placeholder="Nome Materia" class="custom-input">
                    <input type="text" id="manual-prof-name" placeholder="Professore (Opzionale)" class="custom-input">
                    <div style="display: flex; gap: 10px; margin-top: 5px;">
                        <input type="date" id="manual-date" class="custom-input" style="flex: 1;">
                        <input type="time" id="manual-time" class="custom-input" style="flex: 1;">
                    </div>
                    <input type="text" id="manual-room" placeholder="Aula o Note (Opzionale)" class="custom-input" style="margin-top: 5px;">
                    <div style="display: flex; gap: 10px; margin-top: 15px;">
                        <button id="save-manual-btn" class="btn" style="background: var(--inner-red); color: white;">Salva</button>
                        <button id="cancel-manual-btn" class="btn btn-danger">Annulla</button>
                    </div>
                </div>

                <div id="saved-exams-list" class="saved-container">
                    <p class="empty-state">Nessun esame salvato.</p>
                </div>
            </section>
        </div>

    </main>

    <script src="app.js?v=5"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js?v=5').then((reg) => {
                    reg.update();
                    console.log('ServiceWorker registrato e aggiornato.', reg.scope);
                }).catch((err) => {
                    console.error('Errore ServiceWorker:', err);
                });
            });

            // Se il service worker si aggiorna, ricarica automaticamente una volta sola per mostrare la nuova versione
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    refreshing = true;
                    window.location.reload();
                }
            });
        }
    </script>
</body>
</html>
